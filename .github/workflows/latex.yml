name: build-pdf

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ignore includeonly in CI
        run: perl -0pi -e 's/\\includeonly\s*\{[^{}]*\}//g' main.tex

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_biber: true
          args: -pdf -jobname=monaco_bachelor_thesis

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: monaco_bachelor_thesis
          path: monaco_bachelor_thesis.pdf

      - name: Publish latest PDF release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: latest-pdf
          name: Latest compiled PDF
          body: Release aggiornata automaticamente da GitHub Actions.
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: monaco_bachelor_thesis.pdf
          token: ${{ secrets.GITHUB_TOKEN }}
